# 复制到目标项目根目录并改名为 bridge.config.yaml。没有这个文件时桥使用下面这套默认配置。
# agents: 参与协作的身份（agent_id）。product 决定默认门铃；doorbell: auto（按 product 的默认顺序：claude-code → Claude 消息注入、轮询；
#   codex → Codex 队列消息、Codex Stop hook、轮询），也可以写一个门铃或一个列表，如 [codex-queue, poll]。
#   可选的门铃：claude-socket / codex-queue / codex-hook / poll。
# pipeline: 按顺序执行的阶段。gate: true 表示该阶段完成后停下等你在面板上批准；on_reject: 你确认打回时退回到哪个阶段（默认重做本阶段）。
# owns: 该阶段负责的文件（glob）。其他阶段改了这些文件，会在审批卡片上提示（不阻止）。
agents:
  claude: { product: claude-code, doorbell: auto }
  codex:  { product: codex, doorbell: auto }
pipeline:
  - id: plan
    role: 规划/架构
    agent: claude
    gate: true
    instructions: 把目标细化成可执行的设计说明和验收标准，写进项目文件，交接单里列出关键决策。
    owns: [PLAN.md, "docs/**", "doc/**"]
  - id: implement
    role: 编码
    agent: codex
    instructions: 按规划阶段的设计说明实现，并自己跑一遍验收标准。
  - id: review
    role: 审查
    agent: claude
    gate: true
    on_reject: implement
    instructions: 对照验收标准逐项实测。verdict 填 approve 或 reject；review_comments 只写必须修改的阻塞问题，不影响通过的建议写进 observations。
# task_template: 会议定稿后，每个任务按这组阶段走。agent 写 owner（任务负责人）、reviewer（任务审查人）或固定的身份。
# 没有审查人的任务会跳过 agent 为 reviewer 的阶段。
task_template:
  - id: implement
    role: 实现
    agent: owner
    instructions: 按任务描述和会议纪要实现，只改本任务 paths 范围内的文件，并自己验证一遍。
  - id: review
    role: 审查
    agent: reviewer
    gate: true
    on_reject: implement
    instructions: 对照任务描述逐项实测。verdict 填 approve 或 reject；review_comments 只写必须修改的阻塞问题，不影响通过的建议写进 observations。
meetings:
  dir: doc/meetings           # 会议纪要写到这里，定稿时自动提交
  # facilitator: claude       # 负责写定稿和任务清单的成员，默认 agents 里的第一个
leases:
  default_ttl_seconds: 3600   # reserve_paths 不指定 ttl 时的租约时长；任务自带的租约在任务结束时释放
wait:
  poll_seconds: 50            # wait_for_mail 单次最长阻塞秒数，需小于客户端工具超时
  stale_after_seconds: 90     # 超过这么久没动静 → 面板显示“可能断网”
  offline_after_seconds: 300  # 超过这么久没动静 → 判定失联，绑定的身份可被新会话直接 join
mail:
  ring_retry_seconds: 120     # 按了门铃但没来取信 → 隔这么久再按
  max_rings: 3                # 按这么多次仍没反应 → 通知你去叫醒它
  ack_timeout_seconds: 600    # 取走需要确认的信后这么久没确认 → 标红并通知你
notify:
  enabled: true               # Windows 通知
git:
  auto_commit: true           # 每次交接自动提交。只有一个任务在进行时提交全部改动；有并行任务时只提交本任务范围内的文件
  commit_reviews: true        # 审查没改文件也生成一个空提交，git log 里能看到审查结论
